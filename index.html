<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="MK Super Market - Your one-stop shop for Groceries, Electronics, Fashion, and more. Quality products at the best prices with free delivery.">
    <meta name="theme-color" content="#c5a059">
    <title>MK SUPER MARKET | Premium Shopping Experience</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Header with Search Bar -->
    <header class="header">
        <div class="search-container">
            <div class="search-bar" role="search">
                <div class="search-icon" aria-hidden="true">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                </div>
                <input type="text" placeholder="Search products..." class="search-input" id="global-search" aria-label="Search products">
            </div>
            <div id="search-results" class="search-results-dropdown"></div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="luxury-brand-identity">
            <span class="brand-text">MK SUPER MARKET</span>
        </div>

        <!-- Banner Slider -->
        <section class="banner-slider">
            <div class="slider-container" id="main-slider">
                <div class="slide active">
                    <img src="https://mksupermarket.com/uploads/banners/main-hero.webp" alt="Welcome" fetchpriority="high">
                </div>
            </div>
            <div class="slider-dots" id="slider-dots"></div>
        </section>

        <!-- Dynamic Products Section -->
        <section class="flash-sale">
            <div class="section-header">
                <h2>Our Products</h2>
            </div>
            <div class="products-grid" id="products-container">
                <p style="padding: 20px; text-align: center; width: 100%;">Loading products...</p>
            </div>
        </section>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9,22 9,12 15,12 15,22"></polyline></svg>
            <span>Home</span>
        </a>
        <a href="#" class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
            <span>Categories</span>
        </a>
        <a href="#" class="nav-item" id="cart-btn">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
            <span>Cart</span>
            <span class="cart-count" id="cart-count">0</span>
        </a>
    </nav>

    <script src="script.js"></script>
    <script>
        async function loadWebsiteData() {
            try {
                // Fetch Banners
                const bannerRes = await fetch('admin/api.php?action=list&type=banners');
                const banners = await bannerRes.json();
                if(Array.isArray(banners) && banners.length > 0) {
                    const slider = document.getElementById('main-slider');
                    slider.innerHTML = banners.map((b, i) => `
                        <div class="slide ${i === 0 ? 'active' : ''}">
                            <img src="${b.image}" alt="${b.title}" ${i === 0 ? 'fetchpriority="high"' : 'loading="lazy"'} onerror="this.src='https://placehold.co/800x300?text=Banner'">
                        </div>
                    `).join('');
                }

                // Fetch Products
                const productRes = await fetch('admin/api.php?action=list&type=products');
                const products = await productRes.json();
                const container = document.getElementById('products-container');

                if(Array.isArray(products) && products.length > 0) {
                    container.innerHTML = products.map(p => `
                        <div class="product-card">
                            <div class="product-image">
                                <img src="${p.images && p.images[0] ? p.images[0] : 'https://placehold.co/200x200?text=Product'}" alt="${p.name}" loading="lazy">
                                ${p.onSale ? '<span class="discount-badge">SALE</span>' : ''}
                            </div>
                            <div class="product-info">
                                <h3>${p.name}</h3>
                                <div class="price-action">
                                    <div class="price">
                                        <span class="current-price">Rs. ${p.price}</span>
                                        ${p.salePrice ? `<span class="original-price">Rs. ${p.salePrice}</span>` : ''}
                                    </div>
                                    <button class="add-to-cart-btn">
                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                                    </button>
                                </div>
                            </div>
                        </div>
                    `).join('');
                } else {
                    container.innerHTML = '<p style="text-align:center; width:100%; padding: 20px;">No products available.</p>';
                }
            } catch (err) {
                console.log('Static preview mode.');
            }
        }
        document.addEventListener('DOMContentLoaded', loadWebsiteData);
    </script>
</body>
</html>
