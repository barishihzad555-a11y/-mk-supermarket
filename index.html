<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MK Supermarket | Premium Online Shopping</title>

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Cinzel:wght@700;800&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css?v=1.2">
</head>
<body>

    <!-- Professional Header -->
    <header class="header">
        <div class="search-container">
            <div class="search-bar">
                <div class="search-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </div>
                <input type="text" class="search-input" placeholder="Search premium products..." id="product-search">
            </div>
            <!-- Search Results Dropdown -->
            <div class="search-results-dropdown" id="search-results"></div>
        </div>
    </header>

    <main class="main-content">
        <!-- Luxury Brand Identity -->
        <div class="luxury-brand-identity">
            <h1 class="brand-text">MK Supermarket</h1>
        </div>

        <!-- Professional Banner Slider -->
        <section class="banner-slider">
            <div class="slider-container" id="main-banner-container" data-effect="fade">
                <!-- Slides will be injected by script.js -->
                <div class="slide active">
                    <img src="https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=1200&q=80" alt="Welcome">
                </div>
            </div>
            <div class="slider-dots"></div>
        </section>

        <!-- Categories -->
        <section class="categories">
            <div class="categories-grid">
                <div class="category-item" onclick="filterCategory('grocery')">
                    <div class="category-icon bg-grocery">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
                    </div>
                    <span>Grocery</span>
                </div>
                <div class="category-item" onclick="filterCategory('electronics')">
                    <div class="category-icon bg-electronics">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                    </div>
                    <span>Electronics</span>
                </div>
                <div class="category-item" onclick="filterCategory('fashion')">
                    <div class="category-icon bg-fashion">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.38 3.46L16 2.14 11.62 3.46a2 2 0 0 0-1.38 1.9V9l-5.62 1.69a2 2 0 0 0-1.38 1.9V18a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5.36a2 2 0 0 0-1.38-1.9z"/></svg>
                    </div>
                    <span>Fashion</span>
                </div>
                <div class="category-item" onclick="filterCategory('beauty')">
                    <div class="category-icon bg-beauty">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a7 7 0 0 0-7 7c0 1.5.5 3 1.3 4.2L3 22l8-2 8 2-3.3-8.8C18.5 12 19 10.5 19 9a7 7 0 0 0-7-7z"/></svg>
                    </div>
                    <span>Beauty</span>
                </div>
                <div class="category-item" onclick="filterCategory('home')">
                    <div class="category-icon bg-home">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    </div>
                    <span>Home</span>
                </div>
            </div>
        </section>

        <!-- Modernized Flash Sale -->
        <section class="flash-sale">
            <div class="section-header">
                <h2>Flash Sale</h2>
                <div class="countdown-timer">
                    <div class="timer-item">
                        <span class="timer-value" id="hours">00</span>
                        <span class="timer-label">HRS</span>
                    </div>
                    <span class="timer-separator">:</span>
                    <div class="timer-item">
                        <span class="timer-value" id="minutes">00</span>
                        <span class="timer-label">MIN</span>
                    </div>
                    <span class="timer-separator">:</span>
                    <div class="timer-item">
                        <span class="timer-value" id="seconds">00</span>
                        <span class="timer-label">SEC</span>
                    </div>
                </div>
            </div>
            <div class="flash-products">
                <!-- Flash items injected by script.js -->
            </div>
        </section>

        <!-- Popular Products Section -->
        <section class="products">
            <div class="section-header-luxury">
                <h2>Recommended For You</h2>
                <div class="free-delivery-badge">
                    <div class="delivery-icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="1" y="3" width="15" height="13"></rect><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"></polygon><circle cx="5.5" cy="18.5" r="2.5"></circle><circle cx="18.5" cy="18.5" r="2.5"></circle></svg>
                    </div>
                    <span>FREE DELIVERY</span>
                </div>
            </div>
            <div class="products-grid popular-products">
                <!-- Products injected by script.js -->
            </div>
        </section>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item active">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Home</span>
        </a>
        <a href="#" class="nav-item" onclick="toggleCart(event)">
            <div class="cart-count" id="cart-badge">0</div>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
            <span>Cart</span>
        </a>
        <a href="#" class="nav-item" onclick="toggleProfile(event)">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span>Profile</span>
        </a>
    </nav>

    <!-- Cart Drawer -->
    <div class="cart-overlay" id="cart-drawer">
        <div class="cart-container">
            <div class="cart-header">
                <div class="cart-title">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                    <span>Your Cart</span>
                </div>
                <button class="cart-close" onclick="toggleCart()">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="cart-items" id="cart-items-container">
                <!-- Cart items will be injected here -->
            </div>
            <div class="cart-footer">
                <div class="cart-summary">
                    <div class="summary-line">
                        <span>Subtotal</span>
                        <span id="cart-subtotal">Rs 0</span>
                    </div>
                    <div class="summary-line total">
                        <span>Total</span>
                        <span class="total-amount" id="cart-total">Rs 0</span>
                    </div>
                </div>
                <button class="checkout-btn" onclick="checkout()">
                    Checkout Now
                </button>
            </div>
        </div>
    </div>

    <!-- Profile Modal -->
    <div class="modal-overlay" id="profile-modal">
        <div class="profile-popup">
            <button class="profile-close" onclick="toggleProfile()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
            <div id="profile-content">
                <!-- Content handled by script.js (Login/Register or Profile) -->
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="script.js?v=1.2"></script>
</body>
</html>
