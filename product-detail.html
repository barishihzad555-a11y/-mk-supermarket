<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Product Details | MK Luxury Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="product-style.css">
    <style>
        .loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #fff; z-index: 9999; display: flex; align-items: center; justify-content: center;
        }
        .spinner { width: 40px; height: 40px; border: 3px solid #f3f3f3; border-top: 3px solid #c5a059; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="loading" class="loading-overlay"><div class="spinner"></div></div>

    <header class="luxury-header">
        <div class="header-container">
            <button class="back-btn" onclick="location.href='index.html'">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </button>
            <div class="brand-logo">MK LUXE</div>
            <div class="header-actions">
                <button class="action-btn" id="cart-btn">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
                    <span class="cart-badge cart-count" id="cart-count">0</span>
                </button>
            </div>
        </div>
    </header>

    <main class="product-page" id="product-content" style="display: none;">
        <section class="gallery-section">
            <div class="main-image-container">
                <div class="discount-label" id="p-tag">PREMIUM</div>
                <img src="" alt="Product Image" id="main-product-img">
            </div>
            <div class="thumbnail-list" id="thumb-list">
                <!-- Thumbs will be injected if multiple images exist -->
            </div>
        </section>

        <section class="product-details-container">
            <div class="product-meta">
                <span class="category-tag" id="p-category">CATEGORY</span>
                <div class="rating-stars"><span>★★★★★</span></div>
            </div>

            <h1 class="product-title" id="p-title">Product Name</h1>
            <p class="product-tagline">Premium Quality Guaranteed</p>

            <div class="price-container">
                <span class="current-price" id="p-price">0</span>
                <span class="original-price" id="p-old-price">0</span>
            </div>

            <div class="stock-status in-stock">
                <span class="pulse-dot"></span>
                In Stock - Ready to Dispatch
            </div>

            <hr class="divider">

            <div class="purchase-actions">
                <div class="qty-selector">
                    <button class="qty-btn" id="minus">-</button>
                    <input type="number" value="1" min="1" id="qty-input">
                    <button class="qty-btn" id="plus">+</button>
                </div>
                <button class="add-to-cart-luxury add-to-cart-btn" id="main-add-btn">ADD TO BAG</button>
            </div>

            <div class="accordion-container">
                <div class="accordion-item">
                    <div class="accordion-header">Description <span class="icon">+</span></div>
                    <div class="accordion-content">
                        <p id="p-desc">High-quality product from MK Supermarket. Carefully selected to meet our premium standards.</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');

            if (!productId) {
                window.location.href = 'index.html';
                return;
            }

            try {
                // Fetch from your PHP endpoint
                const response = await fetch('upload.php');
                const products = await response.json();

                // Find the specific product
                const product = products.find(p => p.id === productId);

                if (product) {
                    // Update UI
                    document.getElementById('p-title').textContent = product.name;
                    document.getElementById('p-price').textContent = 'Rs ' + parseInt(product.price).toLocaleString();
                    document.getElementById('p-old-price').textContent = 'Rs ' + (parseInt(product.price) * 1.2).toLocaleString();
                    document.getElementById('p-category').textContent = product.category || 'General';
                    document.getElementById('main-product-img').src = product.image;
                    document.getElementById('p-tag').textContent = product.category === 'Flash Sale' ? 'FLASH SALE' : 'PREMIUM';

                    // Setup Add to Cart Button
                    const addBtn = document.getElementById('main-add-btn');
                    addBtn.setAttribute('data-product', product.id);

                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('product-content').style.display = 'block';
                } else {
                    // Fallback to local productsData in script.js if not in dynamic
                    setTimeout(() => {
                        const localP = typeof productsData !== 'undefined' ? productsData.find(p => p.id === productId) : null;
                        if (localP) {
                             document.getElementById('p-title').textContent = localP.name;
                             document.getElementById('p-price').textContent = 'Rs ' + localP.price.toLocaleString();
                             document.getElementById('main-product-img').src = localP.image;
                             document.getElementById('loading').style.display = 'none';
                             document.getElementById('product-content').style.display = 'block';
                        } else {
                             alert('Product not found!');
                             window.location.href = 'index.html';
                        }
                    }, 500);
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('loading').style.display = 'none';
            }
        });

        // Qty controls
        document.getElementById('plus').addEventListener('click', () => {
            const input = document.getElementById('qty-input');
            input.value = parseInt(input.value) + 1;
        });
        document.getElementById('minus').addEventListener('click', () => {
            const input = document.getElementById('qty-input');
            if(input.value > 1) input.value = parseInt(input.value) - 1;
        });

        // Accordion
        document.querySelector('.accordion-header').addEventListener('click', function() {
            const content = this.nextElementSibling;
            const icon = this.querySelector('.icon');
            if (content.style.maxHeight) {
                content.style.maxHeight = null;
                icon.textContent = '+';
            } else {
                content.style.maxHeight = content.scrollHeight + "px";
                icon.textContent = '−';
            }
        });
    </script>
</body>
</html>
