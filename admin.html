<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - MK Supermarket</title>
    <link rel="stylesheet" href="admin-style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Mobile Header -->
    <header class="admin-header">
        <div class="logo">MK <span>Admin</span></div>
        <div class="user-info">
            <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100&h=100&fit=crop" alt="Admin" class="avatar">
        </div>
    </header>

    <main class="admin-container">
        <!-- Sidebar for Desktop, Bottom Nav for Mobile -->
        <nav class="admin-nav">
            <ul>
                <li class="active" data-target="dashboard">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                    <span>Dashboard</span>
                </li>
                <li data-target="products">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
                    <span>Products</span>
                </li>
                <li data-target="orders">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                    <span>Orders</span>
                </li>
                <li data-target="settings">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                    <span>Settings</span>
                </li>
            </ul>
        </nav>

        <section class="admin-content">
            <!-- Dashboard Section -->
            <div id="dashboard" class="content-section active">
                <h1 class="page-title">Dashboard Overview</h1>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon sales"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div>
                        <div class="stat-info">
                            <h3>$12,450</h3>
                            <p>Total Revenue</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon orders"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg></div>
                        <div class="stat-info">
                            <h3>154</h3>
                            <p>Today's Orders</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon users"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
                        <div class="stat-info">
                            <h3>1,240</h3>
                            <p>Total Customers</p>
                        </div>
                    </div>
                </div>

                <div class="recent-orders">
                    <div class="section-header">
                        <h2>Recent Orders</h2>
                        <button class="btn-text">View All</button>
                    </div>
                    <div class="order-list">
                        <!-- Order Item -->
                        <div class="order-item">
                            <div class="order-id">#ORD-7721</div>
                            <div class="order-status completed">Completed</div>
                            <div class="order-total">$45.00</div>
                        </div>
                        <div class="order-item">
                            <div class="order-id">#ORD-7720</div>
                            <div class="order-status pending">Pending</div>
                            <div class="order-total">$128.50</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Products Section -->
            <div id="products" class="content-section">
                <div class="section-header">
                    <h1 class="page-title">Manage Products</h1>
                    <button class="btn-primary" id="add-product-btn">+ Add Product</button>
                </div>

                <div class="search-bar">
                    <input type="text" id="product-search" placeholder="Search products...">
                </div>

                <div class="product-grid-admin">
                    <!-- Example Product -->
                    <div class="product-item-admin">
                        <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=100&h=100&fit=crop" alt="Shoe">
                        <div class="product-details">
                            <h4>Red Nike Sneakers</h4>
                            <p>$89.00 • 45 in stock</p>
                        </div>
                        <div class="product-actions">
                            <button class="btn-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
                            <button class="btn-icon delete"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Add Product Modal -->
            <div id="add-product-modal" class="modal">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2>Add New Product</h2>
                        <span class="close-modal">&times;</span>
                    </div>
                    <form id="product-form">
                        <div class="form-group">
                            <label>Product Name</label>
                            <input type="text" id="p-name" placeholder="e.g. Fresh Milk" required>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Price</label>
                                <input type="number" id="p-price" placeholder="0.00" required>
                            </div>
                            <div class="form-group">
                                <label>Stock</label>
                                <input type="number" id="p-stock" placeholder="0" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Category</label>
                            <select id="product-category">
                                <option value="popular">Popular Products</option>
                                <option value="Flash Sale">Flash Sale</option>
                                <option value="Groceries">Groceries</option>
                                <option value="Electronics">Electronics</option>
                                <option value="Beauty">Beauty</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Product Image</label>
                            <input type="file" id="product-image" accept="image/*" required>
                            <div id="image-preview-container" style="margin-top: 10px; display: none;">
                                <img id="image-preview" src="#" alt="Preview" style="max-width: 100px; border-radius: 8px;">
                            </div>
                        </div>
                        <button type="submit" class="btn-primary w-100" id="save-product-btn">Save Product</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <script src="admin.js"></script>
</body>
</html>
